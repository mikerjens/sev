name: Activate Faroe Islands weather

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect regional forecast
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          marker = '<script>\n/* ---------- EDITABLE DATA ---------- */'
          loader = '<script src="weather-faroe.js"></script>\n<script>\n/* ---------- EDITABLE DATA ---------- */'
          if 'weather-faroe.js' not in text:
              text = text.replace(marker, loader, 1)

          text = text.replace(
              'loadWeather();\nsetInterval(loadWeather, WEATHER_REFRESH_MS);',
              'loadFaroeWeather();\nsetInterval(loadFaroeWeather, WEATHER_REFRESH_MS);'
          )

          path.write_text(text)
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use whole Faroe Islands weather forecast"
          git push
